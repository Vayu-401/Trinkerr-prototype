name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: polls, POSTGRES_PASSWORD: polls, POSTGRES_DB: polls }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U polls" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-secret-key-that-is-long-enough-for-hmac-sha256-signing
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://polls:polls@localhost:5432/polls
      REDIS_URL: redis://localhost:6379/0
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff pip-audit
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Django system check
        run: python manage.py check
      - name: Tests
        run: pytest
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx oxlint
      - name: Type-check and build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000/api
      - name: Tests
        run: npm test
      - name: Dependency audit
        run: npm audit --omit=dev
