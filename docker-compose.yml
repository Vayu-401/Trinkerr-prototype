services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: polls, POSTGRES_PASSWORD: polls, POSTGRES_DB: polls }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polls"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  minio-setup:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3 &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/verification-docs &&
      mc anonymous set none local/verification-docs"
  web:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: ./backend/.env
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
  worker:
    build: ./backend
    command: celery -A config worker -l info
    env_file: ./backend/.env
    volumes: ["./backend:/app"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
  beat:
    build: ./backend
    command: celery -A config beat -l info
    env_file: ./backend/.env
    volumes: ["./backend:/app"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
volumes:
  pgdata: {}
  miniodata: {}
